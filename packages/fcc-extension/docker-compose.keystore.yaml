# AVERLOCK encrypted-keystore overlay. The host path is resolved by
# start-services.sh; the password is read directly from the attached terminal.
services:
  ext-proxy:
    environment:
      - PROXY_SIGNER_MODE=keystore
      - PROXY_KEYSTORE_PATH=/run/averlock-keystore/account
      - PROXY_EXPECTED_SIGNER_ADDRESS=${EXPECTED_SIGNER_ADDRESS:?set EXPECTED_SIGNER_ADDRESS}
      - PROXY_EXPECTED_CHAIN_ID=${EXPECTED_CHAIN_ID:-114}
    volumes:
      - ${PROXY_KEYSTORE_HOST_PATH:?use start-services.sh in keystore mode}:/run/averlock-keystore/account:ro
    stdin_open: true
    tty: true
    # start-services.sh uses `compose run`, giving the proxy exclusive terminal
    # ownership for term.ReadPassword.

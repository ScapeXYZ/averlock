# Railway service config for the AVERLOCK-only event indexer.
# Create this as a separate service with repository root as its root directory and
# select this config (or copy these values into Railway's service settings).
[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/event-indexer/Dockerfile"
watchPatterns = ["packages/event-indexer/**", "package.json", "package-lock.json"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
